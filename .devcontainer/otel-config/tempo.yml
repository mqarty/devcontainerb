server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/trace

metrics_generator:
  registry:
    enabled: true
  storage:
    path: /var/tempo/wal

overrides:
  defaults:
    metrics_generator:
      processors:
        batch:
          timeout: 5s
          send_batch_size: 100
